name: release

on:
  push:
    tags:
      - '*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to build and publish
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    uses: ./.github/workflows/develop.yml
    with:
      ref: ${{ inputs.tag || github.ref }}

  release:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ inputs.tag || github.ref }}
    - uses: actions/download-artifact@v4
      with:
        path: release-assets
        merge-multiple: true
    - name: Publish GitHub Release
      env:
        GH_TOKEN: ${{ github.token }}
        RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
      run: |
        gh release create "$RELEASE_TAG" release-assets/* \
          --verify-tag --title "Gotify Tray $RELEASE_TAG" --generate-notes
